<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Angka Jiwa 8</title>
<!-- Satu-satunya skrip eksternal. Semua visual lain = CSS/SVG inline. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
/* ===== TOKEN: ganti warna & teks utama HANYA di blok :root ini =====
   --accent = emas, --warm = ungu lavender (nama dipertahankan dari template) */
:root{
  --ground:#14062b; --ink:#ffffff; --accent:#fbbf24; --warm:#c084fc;
  --ink-soft:rgba(255,255,255,.72);   /* kontras ~10:1 di atas ground */
  --panel:rgba(192,132,252,.10); --edge:rgba(255,255,255,.18);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:monospace;
  --s-xl:160px; --s-l:96px; --s-m:56px; --s-s:32px;   /* skala tipografi */

  /* Teks (maks 7 kata per layar) */
  --t-tag:"NUMEROLOGI";
  --t-h1a:"Angka"; --t-h1b:"Jiwa"; --t-h1c:"8";
  --t-sub:"Kekuatan, ambisi, kesuksesan";
  --t-klabel:"KARAKTER";
  --t-k1a:"Ambisius"; --t-k1b:"tangguh";
  --t-k2a:"Tegas";    --t-k2b:"berani";
  --t-k3a:"Pandai";   --t-k3b:"keuangan";
  --t-f1a:"Cinta";    --t-f1b:"setia";
  --t-f2a:"Karier";   --t-f2b:"pemimpin";
  --t-f3a:"Keuangan"; --t-f3b:"stabil";
  --t-c1:"Fokus karier"; --t-c2:"Perfeksionis"; --t-c3:"Mudah stres";
  --t-sol:"Seimbangkan hidupmu";
  --t-brand:"@jalurtarot"; --t-cta:"Follow untuk tarot & numerologi";
}

/* ===== DASAR ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ground);font-family:var(--font);color:var(--ink)}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
.clip,#cam{position:absolute;inset:0}

/* ===== LAPISAN LATAR (parallax: glow paling lambat, bintang paling cepat) ===== */
.bg-layer{position:absolute;inset:-300px}
#bg-glow{background:
  radial-gradient(900px 700px at 28% 30%,rgba(147,51,234,.38),transparent 70%),
  radial-gradient(800px 640px at 78% 74%,rgba(251,191,36,.14),transparent 70%)}
#bg-grid{background-image:repeating-radial-gradient(circle at 50% 50%,transparent 0 138px,rgba(251,191,36,.08) 138px 140px)}
#bg-dots{position:absolute;left:-300px;top:-300px;width:2520px;height:1680px}
.d-acc{fill:var(--accent)} .d-ink{fill:var(--ink)} .d-warm{fill:var(--warm)}
#bg-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(20,6,43,.7) 100%)}

/* ===== PANGGUNG: tiap bagian punya .stage di dalam safe area (teks utama 80%) ===== */
.stage{position:absolute;inset:108px 192px;display:flex}
.tx{display:inline-block;white-space:nowrap}
.h-xl{font-size:var(--s-xl);font-weight:700;letter-spacing:-.03em;line-height:1.02}
.h-l{font-size:var(--s-l);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.h-m{font-size:var(--s-m);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.b-m{font-size:var(--s-m);font-weight:400;line-height:1.1;color:var(--ink-soft)}
.t-tag::before{content:var(--t-tag)}
.t-h1a::before{content:var(--t-h1a)} .t-h1b::before{content:var(--t-h1b)} .t-h1c::before{content:var(--t-h1c)}
.t-sub::before{content:var(--t-sub)} .t-klabel::before{content:var(--t-klabel)}
.t-k1a::before{content:var(--t-k1a)} .t-k1b::before{content:var(--t-k1b)}
.t-k2a::before{content:var(--t-k2a)} .t-k2b::before{content:var(--t-k2b)}
.t-k3a::before{content:var(--t-k3a)} .t-k3b::before{content:var(--t-k3b)}
.t-f1a::before{content:var(--t-f1a)} .t-f1b::before{content:var(--t-f1b)}
.t-f2a::before{content:var(--t-f2a)} .t-f2b::before{content:var(--t-f2b)}
.t-f3a::before{content:var(--t-f3a)} .t-f3b::before{content:var(--t-f3b)}
.t-c1::before{content:var(--t-c1)} .t-c2::before{content:var(--t-c2)} .t-c3::before{content:var(--t-c3)}
.t-sol::before{content:var(--t-sol)}
.t-brand::before{content:var(--t-brand)} .t-cta::before{content:var(--t-cta)}

/* ===== 1. HOOK: teks kiri, emblem tak-hingga (simbol angka 8) kanan ===== */
#s-hook .stage{flex-direction:row;align-items:center;justify-content:space-between}
#hook-left{display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.tag{font-family:var(--mono);font-size:var(--s-s);font-weight:400;letter-spacing:.18em;color:var(--warm);margin-bottom:48px}
#hook-title{display:flex;flex-direction:column;align-items:flex-start}
.ln{display:flex;gap:.28em}
.w3{color:var(--accent)}
#hook-line{margin-top:48px;width:620px;height:8px;border-radius:4px;background:var(--accent)}
.sub{margin-top:36px;font-size:var(--s-m);font-weight:400;line-height:1.1;color:var(--ink-soft)}
#emblem{width:480px;height:480px;flex:none}
.e-ring{fill:none;stroke:var(--edge);stroke-width:3}
.e-dash{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 16}
.e-glow{fill:none;stroke:var(--warm);stroke-width:34;stroke-linejoin:round;opacity:.28}
.e-inf{fill:none;stroke:var(--accent);stroke-width:14;stroke-linejoin:round;stroke-linecap:round}
.e-dg{fill:var(--accent)} .e-dv{fill:var(--warm)}

/* ===== 2. KARAKTER: 3 kartu ===== */
#s-karakter .stage{align-items:center;justify-content:center}
#kar-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:40px}
.k-label{font-family:var(--mono);font-size:var(--s-s);font-weight:400;letter-spacing:.18em;color:var(--warm)}
#kars{display:flex;gap:48px}
.k-card{width:480px;height:400px;padding:44px;border-radius:28px;background:var(--panel);border:2px solid var(--edge);
  display:flex;flex-direction:column;justify-content:space-between}
.k-ic{width:104px;height:104px}
.k-ic *{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.k-lbl{display:flex;flex-direction:column}

/* ===== 3. PETA HIDUP (mockup kartu dari div/SVG) ===== */
#s-peta .stage{flex-direction:row;align-items:center;justify-content:center;gap:56px}
#mock{position:relative;width:1000px;height:564px;border-radius:32px;background:rgba(255,255,255,.05);border:2px solid var(--edge);display:flex}
.m-side{width:150px;padding:28px 0;display:flex;flex-direction:column;align-items:center;gap:26px;border-right:2px solid var(--edge)}
.m-logo{width:48px;height:48px;border-radius:14px;background:var(--accent)}
.m-nav{width:64px;height:12px;border-radius:6px;background:var(--edge)}
.m-main{flex:1;padding:22px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:240px 1fr;gap:20px}
.m-panel{position:relative;border-radius:20px;background:var(--panel);border:2px solid var(--edge);padding:20px}
.m-panel.wide{grid-column:1/-1}
.hl{position:absolute;inset:-8px;border-radius:26px;border:4px solid var(--accent);opacity:0;pointer-events:none}
#m-cinta svg{display:block;width:100%;height:100%}
.hr-a{fill:none;stroke:var(--accent);stroke-width:7;stroke-linejoin:round}
.hr-b{fill:none;stroke:var(--warm);stroke-width:7;stroke-linejoin:round}
.m-rows{display:flex;flex-direction:column;gap:14px}
.m-row{display:flex;align-items:center;gap:14px;height:36px}
.m-sq{width:36px;height:36px;border-radius:10px;background:var(--edge);flex:none}
.m-track{flex:1;height:14px;border-radius:7px;background:var(--edge)}
.m-fill{display:block;height:14px;border-radius:7px;background:var(--accent)}
.m-fill.alt{background:var(--warm)}
.f90{width:90%} .f72{width:72%} .f58{width:58%} .f40{width:40%}
#m-uang svg{display:block;width:100%;height:100%}
.cb{fill:var(--accent)} .cb.last{fill:var(--warm)}
#m-trend{fill:none;stroke:var(--ink-soft);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#feats{display:flex;flex-direction:column;justify-content:space-between;width:440px;height:564px}
.feat{position:relative;display:flex;align-items:center;gap:28px;height:172px;padding:0 32px;border-radius:28px;
  background:var(--panel);border:2px solid var(--edge);opacity:.7}
.feat .hl{inset:-4px;border-radius:32px}
.f-ic{width:72px;height:72px;flex:none}
.f-ic *{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.f-lbl{display:flex;flex-direction:column}

/* ===== 4. TANTANGAN + solusi ===== */
#s-tantangan .stage{align-items:center;justify-content:center}
#chal{display:flex;flex-direction:column;align-items:center;gap:28px;width:100%}
.c-row{position:relative;display:flex;align-items:center;gap:48px;width:920px;height:150px}
.c-ic{width:96px;height:96px;flex:none}
.c-ic *{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.rule{position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:var(--edge)}
.rule i{display:block;width:100%;height:4px;border-radius:2px;background:var(--accent)}
#sol{margin-top:20px;display:flex;align-items:center;padding:28px 64px;border-radius:999px;background:var(--accent);color:var(--ground);
  font-size:var(--s-m);font-weight:700;letter-spacing:-.02em}

/* ===== 5. CTA ===== */
#s-cta .stage{flex-direction:column;align-items:center;justify-content:center;gap:72px}
#lockup{display:flex;align-items:center;gap:40px}
#mark{width:160px;height:160px}
.mk-bg{fill:var(--accent)} .mk-inf{fill:none;stroke:var(--ground);stroke-width:10;stroke-linejoin:round;stroke-linecap:round} .mk-dot{fill:var(--warm)}
.pill{display:flex;align-items:center;padding:28px 64px;border-radius:999px;background:var(--accent);color:var(--ground);
  font-size:var(--s-m);font-weight:700;letter-spacing:-.02em}
</style>
</head>
<body>
<!-- Root: durasi video = data-duration. Tiap bagian = satu .clip (jendela tampil), overlap 0.4 s untuk crossfade. -->
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">

  <!-- Latar permanen: 3 lapisan bergerak (glow, cincin, bintang) + vinyet statis -->
  <div id="bg" class="clip" data-start="0" data-duration="20" data-track-index="0">
    <div id="bg-glow" class="bg-layer"></div>
    <div id="bg-grid" class="bg-layer"></div>
    <svg id="bg-dots" viewBox="0 0 2520 1680" aria-hidden="true"></svg>
    <div id="bg-vig"></div>
  </div>

  <!-- Wrapper kamera: push-in 1.00 -> 1.06 sepanjang video -->
  <div id="cam">

    <!-- 1. HOOK 0.0-3.4 -->
    <div id="s-hook" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
      <div class="stage">
        <div id="hook-left">
          <div class="tag tx t-tag"></div>
          <div id="hook-title">
            <div class="ln h-xl"><span class="w w1 tx t-h1a"></span><span class="w w2 tx t-h1b"></span></div>
            <div class="ln h-xl"><span class="w w3 tx t-h1c"></span></div>
          </div>
          <div id="hook-line"></div>
          <div class="sub tx t-sub"></div>
        </div>
        <!-- Emblem: simbol tak-hingga (angka 8 berbaring) dalam cincin berputar pelan -->
        <svg id="emblem" viewBox="0 0 480 480" aria-hidden="true">
          <circle class="e-ring" cx="240" cy="240" r="222"/>
          <circle class="e-ring" cx="240" cy="240" r="160"/>
          <g id="ring">
            <circle class="e-dash" cx="240" cy="240" r="196"/>
            <circle class="e-dg" cx="436" cy="240" r="7"/>
            <circle class="e-dv" cx="378.6" cy="378.6" r="7"/>
            <circle class="e-dg" cx="240" cy="436" r="7"/>
            <circle class="e-dv" cx="101.4" cy="378.6" r="7"/>
            <circle class="e-dg" cx="44" cy="240" r="7"/>
            <circle class="e-dv" cx="101.4" cy="101.4" r="7"/>
            <circle class="e-dg" cx="240" cy="44" r="7"/>
            <circle class="e-dv" cx="378.6" cy="101.4" r="7"/>
          </g>
          <path class="e-glow" d="M240 240C262 190 360 190 360 240 360 290 262 290 240 240 218 190 120 190 120 240 120 290 218 290 240 240Z"/>
          <path class="e-inf" d="M240 240C262 190 360 190 360 240 360 290 262 290 240 240 218 190 120 190 120 240 120 290 218 290 240 240Z"/>
        </svg>
      </div>
    </div>

    <!-- 2. KARAKTER 3.0-8.4 -->
    <div id="s-karakter" class="clip" data-start="3" data-duration="5.4" data-track-index="2">
      <div class="stage">
        <div id="kar-wrap">
          <div class="k-label tx t-klabel"></div>
          <div id="kars">
            <div class="k-card">
              <!-- gunung + bendera: ambisi -->
              <svg class="k-ic" viewBox="0 0 104 104" aria-hidden="true"><path d="M10 86 40 38 56 62 68 46 94 86Z"/><path d="M40 38 40 16"/><path d="M40 16 58 22 40 28"/></svg>
              <div class="k-lbl h-m"><span class="tx t-k1a"></span><span class="tx t-k1b"></span></div>
            </div>
            <div class="k-card">
              <!-- perisai: tegas -->
              <svg class="k-ic" viewBox="0 0 104 104" aria-hidden="true"><path d="M52 12 88 26 88 54C88 74 72 88 52 94 32 88 16 74 16 54L16 26Z"/><path d="M36 52 48 64 70 40"/></svg>
              <div class="k-lbl h-m"><span class="tx t-k2a"></span><span class="tx t-k2b"></span></div>
            </div>
            <div class="k-card">
              <!-- koin: keuangan -->
              <svg class="k-ic" viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="38"/><path d="M52 30 52 74"/><path d="M62 40C58 34 42 34 42 44 42 54 62 50 62 60 62 70 46 70 42 64"/></svg>
              <div class="k-lbl h-m"><span class="tx t-k3a"></span><span class="tx t-k3b"></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. PETA HIDUP 8.0-14.4 -->
    <div id="s-peta" class="clip" data-start="8" data-duration="6.4" data-track-index="3">
      <div class="stage">
        <div id="mock">
          <div class="m-side"><i class="m-logo"></i><i class="m-nav"></i><i class="m-nav"></i><i class="m-nav"></i><i class="m-nav"></i></div>
          <div class="m-main">
            <div id="m-cinta" class="m-panel">
              <svg viewBox="0 0 150 100" aria-hidden="true">
                <path class="hr-a heart" d="M50 84C20 62 10 44 10 30 10 16 22 8 34 8 42 8 48 12 50 18 52 12 58 8 66 8 78 8 90 16 90 30 90 44 80 62 50 84Z"/>
                <path class="hr-b heart" d="M100 84C70 62 60 44 60 30 60 16 72 8 84 8 92 8 98 12 100 18 102 12 108 8 116 8 128 8 140 16 140 30 140 44 130 62 100 84Z"/>
              </svg>
              <div class="hl"></div>
            </div>
            <div id="m-karier" class="m-panel">
              <div class="m-rows">
                <div class="m-row"><i class="m-sq"></i><span class="m-track"><i class="m-fill f90"></i></span></div>
                <div class="m-row"><i class="m-sq"></i><span class="m-track"><i class="m-fill alt f72"></i></span></div>
                <div class="m-row"><i class="m-sq"></i><span class="m-track"><i class="m-fill f58"></i></span></div>
                <div class="m-row"><i class="m-sq"></i><span class="m-track"><i class="m-fill alt f40"></i></span></div>
              </div>
              <div class="hl"></div>
            </div>
            <div id="m-uang" class="m-panel wide">
              <svg viewBox="0 0 726 216" aria-hidden="true">
                <rect class="cb" x="25"  y="130" width="52" height="70"  rx="8"/>
                <rect class="cb" x="103" y="104" width="52" height="96"  rx="8"/>
                <rect class="cb" x="181" y="116" width="52" height="84"  rx="8"/>
                <rect class="cb" x="259" y="78"  width="52" height="122" rx="8"/>
                <rect class="cb" x="337" y="90"  width="52" height="110" rx="8"/>
                <rect class="cb" x="415" y="52"  width="52" height="148" rx="8"/>
                <rect class="cb" x="493" y="64"  width="52" height="136" rx="8"/>
                <rect class="cb" x="571" y="24"  width="52" height="176" rx="8"/>
                <rect class="cb last" x="649" y="40" width="52" height="160" rx="8"/>
                <polyline id="m-trend" points="51,112 129,86 207,98 285,60 363,72 441,34 519,46 597,8 675,22"/>
              </svg>
              <div class="hl"></div>
            </div>
          </div>
        </div>
        <div id="feats">
          <div id="f1" class="feat">
            <svg class="f-ic" viewBox="0 0 72 72" aria-hidden="true"><path d="M36 60C14 44 8 32 8 24 8 15 15 9 23 9 29 9 34 12 36 17 38 12 43 9 49 9 57 9 64 15 64 24 64 32 58 44 36 60Z"/></svg>
            <div class="f-lbl h-m"><span class="tx t-f1a"></span><span class="tx t-f1b"></span></div>
            <div class="hl"></div>
          </div>
          <div id="f2" class="feat">
            <svg class="f-ic" viewBox="0 0 72 72" aria-hidden="true"><rect x="8" y="22" width="56" height="38" rx="8"/><path d="M26 22 26 14 46 14 46 22"/><path d="M8 38 64 38"/></svg>
            <div class="f-lbl h-m"><span class="tx t-f2a"></span><span class="tx t-f2b"></span></div>
            <div class="hl"></div>
          </div>
          <div id="f3" class="feat">
            <svg class="f-ic" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="26"/><path d="M36 20 36 52"/><path d="M44 28C41 23 28 23 28 31 28 39 44 35 44 43 44 51 31 51 28 46"/></svg>
            <div class="f-lbl h-m"><span class="tx t-f3a"></span><span class="tx t-f3b"></span></div>
            <div class="hl"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. TANTANGAN + SOLUSI 14.0-18.4 -->
    <div id="s-tantangan" class="clip" data-start="14" data-duration="4.4" data-track-index="4">
      <div class="stage">
        <div id="chal">
          <div class="c-row">
            <svg class="c-ic" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40"/><path d="M48 26 48 54"/><path d="M48 68 48 70"/></svg>
            <div class="h-l tx t-c1"></div>
            <div class="rule"><i></i></div>
          </div>
          <div class="c-row">
            <svg class="c-ic" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40"/><path d="M48 26 48 54"/><path d="M48 68 48 70"/></svg>
            <div class="h-l tx t-c2"></div>
            <div class="rule"><i></i></div>
          </div>
          <div class="c-row">
            <svg class="c-ic" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40"/><path d="M48 26 48 54"/><path d="M48 68 48 70"/></svg>
            <div class="h-l tx t-c3"></div>
            <div class="rule"><i></i></div>
          </div>
          <div id="sol"><span class="tx t-sol"></span></div>
        </div>
      </div>
    </div>

    <!-- 5. CTA 18.0-20.0 (tween terakhir selesai 18.8, lalu HOLD 1.2 s) -->
    <div id="s-cta" class="clip" data-start="18" data-duration="2" data-track-index="5">
      <div class="stage">
        <div id="lockup">
          <svg id="mark" viewBox="0 0 160 160" aria-hidden="true">
            <rect class="mk-bg" width="160" height="160" rx="40"/>
            <path class="mk-inf" d="M80 84C92 66 122 66 122 84 122 102 92 102 80 84 68 66 38 66 38 84 38 102 68 102 80 84Z"/>
            <circle class="mk-dot" cx="80" cy="38" r="9"/>
          </svg>
          <div class="wordmark h-xl tx t-brand"></div>
        </div>
        <div id="cta-pill" class="pill"><span class="tx t-cta"></span></div>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  var IN = "power3.out", OUT = "power2.in", LOOP = "sine.inOut";   /* easing: masuk / keluar / napas */

  /* --- Bintang latar: PRNG ber-seed (mulberry32), posisi tetap & deterministik --- */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var rnd = mulberry32(20261112), dots = document.getElementById("bg-dots"), NS = "http://www.w3.org/2000/svg";
  for (var i = 0; i < 72; i++) {
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", (rnd() * 2520).toFixed(1));
    c.setAttribute("cy", (rnd() * 1680).toFixed(1));
    c.setAttribute("r", (1.5 + rnd() * 3.5).toFixed(1));
    c.setAttribute("opacity", (0.2 + rnd() * 0.5).toFixed(2));
    c.setAttribute("class", i % 9 === 0 ? "d-acc" : i % 3 === 0 ? "d-ink" : "d-warm");
    dots.appendChild(c);
  }

  var tl = gsap.timeline({paused: true});

  /* --- LATAR: drift linear (satu-satunya ease none) + napas glow. Kecepatan beda = parallax. --- */
  tl.fromTo("#bg-glow", {x:-50,  y:20},  {x:50,   y:-20, duration:20, ease:"none"}, 0);
  tl.fromTo("#bg-grid", {x:0,    y:0},   {x:-120, y:-60, duration:20, ease:"none"}, 0);
  tl.fromTo("#bg-dots", {x:80,   y:40},  {x:-180, y:-90, duration:20, ease:"none"}, 0);
  tl.fromTo("#bg-glow", {scale:1}, {scale:1.12, duration:10, ease:LOOP, yoyo:true, repeat:1}, 0);

  /* --- KAMERA: push-in 1.00 -> 1.06 sepanjang 20 s --- */
  tl.fromTo("#cam", {scale:1}, {scale:1.06, transformOrigin:"50% 50%", duration:20, ease:"power1.inOut"}, 0);

  /* --- 1. HOOK: frame 0 sudah berisi (tag, emblem, garis emas, kata pertama samar) --- */
  tl.fromTo("#hook-line", {scaleX:.12, transformOrigin:"0% 50%"}, {scaleX:1, duration:1.5, ease:IN}, 0.2);   /* origin juga di state awal: frame 0 rata kiri */
  tl.from(".w1", {y:60, opacity:.35, duration:.7, ease:IN}, 0.15);
  tl.from(".w2", {y:60, opacity:0, duration:.7, ease:IN}, 0.4);
  tl.from(".w3", {y:60, opacity:0, scale:.92, transformOrigin:"0% 50%", duration:.8, ease:IN}, 0.95);
  tl.from(".sub", {y:30, opacity:0, duration:.6, ease:IN}, 1.3);
  tl.from("#emblem", {scale:.9, opacity:.4, transformOrigin:"50% 50%", duration:1.2, ease:IN}, 0);
  tl.to("#ring", {rotation:50, svgOrigin:"240 240", duration:3.4, ease:"none"}, 0);                   /* cincin berputar pelan = tidak ada dead stretch */
  tl.to("#hook-title", {scale:1.03, transformOrigin:"0% 50%", duration:1.4, ease:LOOP}, 1.6);        /* napas */
  tl.to("#s-hook .stage", {opacity:0, x:-40, duration:.4, ease:OUT}, 3.0);                           /* keluar overlap 0.4 s */

  /* --- 2. KARAKTER: label lalu 3 kartu bergantian, stagger 0.15 --- */
  tl.fromTo("#s-karakter .stage", {opacity:0, x:40}, {opacity:1, x:0, duration:.5, ease:IN}, 3.0);
  tl.from(".k-label", {y:20, opacity:0, duration:.5, ease:IN}, 3.2);
  tl.from(".k-card", {y:60, opacity:0, duration:.7, ease:IN, stagger:.15}, 3.3);
  tl.from(".k-ic", {scale:.6, opacity:0, transformOrigin:"50% 50%", duration:.5, ease:IN, stagger:.15}, 3.6);
  tl.to(".k-card", {scale:1.03, transformOrigin:"50% 50%", duration:1.2, ease:LOOP, yoyo:true, repeat:2, stagger:.15}, 4.5);
  tl.to("#s-karakter .stage", {opacity:0, x:-40, duration:.4, ease:OUT}, 8.0);

  /* --- 3. PETA HIDUP: kartu dibangun, lalu 3 area menyorot bergiliran (10.2 / 11.4 / 12.6) --- */
  tl.fromTo("#s-peta .stage", {opacity:0, x:40}, {opacity:1, x:0, duration:.5, ease:IN}, 8.0);
  tl.from("#mock", {y:50, opacity:0, duration:.7, ease:IN}, 8.2);
  tl.from(".m-panel", {y:24, opacity:0, duration:.5, ease:IN, stagger:.12}, 8.6);
  tl.from(".feat", {x:40, opacity:0, duration:.5, ease:IN, stagger:.12}, 8.5);
  tl.from(".heart", {scale:.5, opacity:0, transformOrigin:"50% 50%", duration:.6, ease:IN, stagger:.15}, 9.0);
  tl.from(".m-fill", {scaleX:0, transformOrigin:"0% 50%", duration:.7, ease:IN, stagger:.08}, 9.0);
  tl.from(".cb", {scaleY:0, transformOrigin:"50% 100%", duration:.6, ease:IN, stagger:.05}, 9.0);
  tl.from("#m-trend", {opacity:0, duration:.5, ease:IN}, 9.6);
  [["#f1", "#m-cinta"], ["#f2", "#m-karier"], ["#f3", "#m-uang"]].forEach(function (p, i) {
    var t = 10.2 + i * 1.2, hl = p[0] + " .hl, " + p[1] + " .hl";
    tl.to(p[0], {opacity:1, scale:1.04, transformOrigin:"0% 50%", duration:.35, ease:IN}, t);
    tl.to(hl, {opacity:1, duration:.35, ease:IN}, t);
    if (i < 2) {                                                                                      /* area terakhir bertahan sampai keluar */
      tl.to(p[0], {opacity:.7, scale:1, duration:.3, ease:OUT}, t + .9);
      tl.to(hl, {opacity:0, duration:.3, ease:OUT}, t + .9);
    }
  });
  tl.to("#s-peta .stage", {opacity:0, x:-40, duration:.4, ease:OUT}, 14.0);

  /* --- 4. TANTANGAN: 3 baris waspada muncul berurutan, lalu pil solusi --- */
  tl.fromTo("#s-tantangan .stage", {opacity:0, x:40}, {opacity:1, x:0, duration:.5, ease:IN}, 14.0);
  tl.from(".c-row", {y:40, opacity:0, duration:.6, ease:IN, stagger:.3}, 14.3);
  tl.from(".c-ic", {scale:.6, opacity:0, transformOrigin:"50% 50%", duration:.5, ease:IN, stagger:.3}, 14.5);
  tl.from(".rule i", {scaleX:0, transformOrigin:"0% 50%", duration:.9, ease:IN, stagger:.3}, 14.5);
  tl.to(".c-row", {opacity:.72, duration:.5, ease:LOOP}, 16.0);                                       /* redupkan baris agar solusi jadi fokus */
  tl.from("#sol", {y:40, opacity:0, duration:.6, ease:IN}, 16.0);
  tl.to("#sol", {scale:1.04, transformOrigin:"50% 50%", duration:1.4, ease:LOOP}, 16.6);              /* napas setelah mendarat */
  tl.to("#s-tantangan .stage", {opacity:0, x:-40, duration:.4, ease:OUT}, 18.0);

  /* --- 5. CTA: semua mendarat <= 18.8 s, lalu HOLD 1.2 s tanpa tween konten --- */
  tl.fromTo("#s-cta .stage", {opacity:0, x:40}, {opacity:1, x:0, duration:.5, ease:IN}, 18.0);
  tl.from("#mark", {scale:.6, opacity:0, transformOrigin:"50% 50%", duration:.5, ease:IN}, 18.05);
  tl.from(".wordmark", {x:40, opacity:0, duration:.5, ease:IN}, 18.15);
  tl.from("#cta-pill", {y:40, opacity:0, duration:.5, ease:IN}, 18.3);

  /* --- Daftarkan SETELAH tween terakhir, lalu seek(0) --- */
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
})();
</script>
</body>
</html>
