<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>JALUR TAROT — Anda Akan Menikah</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<style>

:root{
  --ink:#090512;--night:#140b23;--royal:#211039;--violet:#49216d;
  --plum:#74365f;--gold:#f2cf7a;--champagne:#fff0c3;--ivory:#fff8e9;
  --muted:rgba(255,240,195,.68);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ivory)}
#composition{
  position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#32184c 0%,#170d27 43%,#090512 78%);
  isolation:isolate;
}
#composition:before{
  content:"";position:absolute;inset:-8%;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(0,0,0,.28) 72%,rgba(0,0,0,.78) 100%);
}
#composition:after{
  content:"";position:absolute;inset:0;z-index:90;pointer-events:none;opacity:.12;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E");
}
.bg,.scene,.chapter-root{position:absolute;inset:0}
.chapter-root{width:1080px;height:1920px;overflow:hidden}
.chapter-host{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden}
.bg{pointer-events:none}
.nebula{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;mix-blend-mode:screen}
.n1{width:850px;height:620px;left:-260px;top:220px;background:#67358b;transform:rotate(-25deg)}
.n2{width:780px;height:900px;right:-350px;top:650px;background:#48206e;transform:rotate(35deg)}
.n3{width:650px;height:450px;left:170px;bottom:-190px;background:#7a3c64;opacity:.16}
.stars{position:absolute;inset:0}
.star{position:absolute;border-radius:50%;background:#fff0c3;box-shadow:0 0 10px 2px rgba(242,207,122,.55)}
.dust{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px 4px rgba(242,207,122,.3)}
.light-beam{position:absolute;width:3px;height:1450px;left:50%;top:180px;transform:rotate(24deg);background:linear-gradient(transparent,rgba(255,224,155,.16),transparent);filter:blur(16px);opacity:.35}
.scene{z-index:10;opacity:0;visibility:visible;overflow:hidden}
.scene .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:150px 105px 235px}
.eyebrow{font-size:23px;letter-spacing:9px;text-transform:uppercase;color:var(--gold);font-weight:600}
.headline{
  font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.08;
  font-size:92px;letter-spacing:-2px;color:var(--ivory);text-shadow:0 8px 38px rgba(0,0,0,.65);
}
.headline .gold{color:var(--gold);font-style:italic}
.sub{font-size:31px;line-height:1.55;letter-spacing:1.2px;color:rgba(255,248,233,.83);max-width:800px;margin-top:34px}
.rule{width:170px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:42px auto}
.frame{position:absolute;inset:74px 62px 110px;pointer-events:none;opacity:.82}
.frame:before,.frame:after{content:"";position:absolute;border:1px solid rgba(242,207,122,.48)}
.frame:before{inset:0}
.frame:after{inset:13px;border:1px solid rgba(242,207,122,.16)}
.corner{position:absolute;width:95px;height:95px;border-color:var(--gold);opacity:.85}
.tl{top:0;left:0;border-top:2px solid;border-left:2px solid}
.tr{top:0;right:0;border-top:2px solid;border-right:2px solid}
.bl{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid}
.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid}
.corner:after{content:"";position:absolute;width:22px;height:22px;border:1px solid var(--gold);transform:rotate(45deg);top:12px;left:12px;opacity:.7}
.frame-label{position:absolute;bottom:-31px;left:50%;transform:translateX(-50%);font:17px Georgia,serif;letter-spacing:7px;color:rgba(242,207,122,.7);white-space:nowrap}
.moon{position:absolute;width:410px;height:410px;top:230px;left:335px;border-radius:50%;
  background:radial-gradient(circle at 36% 35%,#fff8df 0%,#e9c985 22%,#9d6b7c 48%,#39204d 70%,transparent 72%);
  box-shadow:0 0 80px rgba(242,207,122,.22),0 0 180px rgba(131,75,159,.3)}
.moon:after{content:"";position:absolute;width:370px;height:370px;left:112px;top:-42px;border-radius:50%;background:#160d25}
.orbit{position:absolute;border:1px solid rgba(242,207,122,.35);border-radius:50%;transform:rotate(-24deg)}
.orbit.o1{width:760px;height:330px;left:160px;top:340px}
.orbit.o2{width:900px;height:470px;left:90px;top:275px;transform:rotate(31deg);border-color:rgba(255,240,195,.15)}
.hero-symbol{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:660px;height:660px;opacity:.92}
.couple{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:790px;height:890px;filter:drop-shadow(0 0 40px rgba(242,207,122,.16))}
.rings{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:660px;height:520px}
.rose{position:absolute;width:270px;height:370px;bottom:255px;opacity:.8}
.rose.left{left:100px;transform:rotate(-15deg)}
.rose.right{right:100px;transform:scaleX(-1) rotate(-15deg)}
.caption{position:absolute;bottom:165px;left:0;right:0;text-align:center;font-size:19px;letter-spacing:7px;color:rgba(242,207,122,.75)}
.brand{font-family:Georgia,serif;font-size:43px;letter-spacing:12px;color:var(--gold)}
.handle{font-size:23px;letter-spacing:5px;color:rgba(255,240,195,.76);margin-top:18px}
.small-note{font-size:21px;line-height:1.5;color:rgba(255,248,233,.58);max-width:760px;margin-top:30px}
#status{position:absolute;left:0;top:0;opacity:0;pointer-events:none}

</style>
</head>

<script>
(function(){
  "use strict";
  // Fixed-seed placement: identical on every load and every render.
  const stars = document.getElementById("stars");
  let seed = 7312026;
  const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  for (let i = 0; i < 145; i++) {
    const el = document.createElement("i");
    el.className = "star";
    const size = 1 + rand() * 3.2;
    el.style.cssText = `left:${rand()*100}%;top:${rand()*100}%;width:${size}px;height:${size}px;opacity:${.18+rand()*.72}`;
    stars.appendChild(el);
  }
  for (let i = 0; i < 42; i++) {
    const el = document.createElement("i");
    el.className = "dust";
    const size = 2 + rand() * 3;
    el.style.cssText = `left:${rand()*100}%;top:${rand()*100}%;width:${size}px;height:${size}px;opacity:${.2+rand()*.55}`;
    stars.appendChild(el);
  }
})();
</script>
<script>
(function(){
  "use strict";
  const timeline = gsap.timeline({ paused: true });
  // Sub-compositions are nested automatically by HyperFrames; do not add them here.
  timeline.to(".n1", { x: 22, y: -18, duration: 60, ease: "none" }, 0);
  timeline.to(".n2", { x: -18, y: 20, duration: 60, ease: "none" }, 0);
  timeline.to(".light-beam", { rotation: 30, opacity: .55, duration: 30, ease: "sine.inOut" }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["jalurtarot-marriage-60s"] = timeline;
})();
</script>
