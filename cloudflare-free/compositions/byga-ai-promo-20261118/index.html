<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>BYGA.AI - Promo 20 detik</title>
<!-- Satu-satunya skrip eksternal. Semua visual lain = CSS/SVG inline. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
/* ===== TOKEN: ganti warna & teks utama HANYA di blok :root ini ===== */
:root{
  --ground:#0b1020; --ink:#ffffff; --accent:#38bdf8; --warm:#f59e0b;
  --ink-soft:rgba(255,255,255,.72);
  --panel:rgba(255,255,255,.06); --edge:rgba(255,255,255,.16);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:monospace;
  --s-xl:160px; --s-l:96px; --s-m:56px; --s-s:32px;

  /* Teks (maks 7 kata per layar) */
  --t-tag:"BYGA.AI";
  --t-h1a:"Bangun"; --t-h1b:"apa pun"; --t-h1c:"dari HP.";
  --t-p1a:"Laptop";  --t-p1b:"mahal";
  --t-p2a:"Coding";  --t-p2b:"ribet";
  --t-p3a:"Ide";     --t-p3b:"mandek";
  --t-f1a:"Website"; --t-f1b:"instan";
  --t-f2a:"Aplikasi"; --t-f2b:"cepat";
  --t-f3a:"Otomasi"; --t-f3b:"mudah";
  --t-b1:"dari HP"; --t-b2:"menit jadi"; --t-b3:"lebih cepat";
  --t-brand:"BYGA.AI"; --t-cta:"Mulai dari HP";
}

/* ===== DASAR ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ground);font-family:var(--font);color:var(--ink)}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
.clip,#cam{position:absolute;inset:0}

/* ===== LAPISAN LATAR ===== */
.bg-layer{position:absolute;inset:-300px}
#bg-glow{background:
  radial-gradient(900px 700px at 28% 30%,rgba(56,189,248,.26),transparent 70%),
  radial-gradient(800px 640px at 78% 74%,rgba(245,158,11,.16),transparent 70%)}
#bg-grid{background-image:
  linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:96px 96px}
#bg-dots{position:absolute;left:-300px;top:-300px;width:2520px;height:1680px}
.d-acc{fill:var(--accent)} .d-ink{fill:var(--ink)} .d-warm{fill:var(--warm)}
#bg-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(11,16,32,.7) 100%)}

/* ===== PANGGUNG ===== */
.stage{position:absolute;inset:108px 192px;display:flex}
.tx{display:inline-block;white-space:nowrap}
.h-xl{font-size:var(--s-xl);font-weight:700;letter-spacing:-.03em;line-height:1.02}
.h-l{font-size:var(--s-l);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.h-m{font-size:var(--s-m);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.b-m{font-size:var(--s-m);font-weight:400;line-height:1.1;color:var(--ink-soft)}
.t-tag::before{content:var(--t-tag)}
.t-h1a::before{content:var(--t-h1a)} .t-h1b::before{content:var(--t-h1b)} .t-h1c::before{content:var(--t-h1c)}
.t-p1a::before{content:var(--t-p1a)} .t-p1b::before{content:var(--t-p1b)}
.t-p2a::before{content:var(--t-p2a)} .t-p2b::before{content:var(--t-p2b)}
.t-p3a::before{content:var(--t-p3a)} .t-p3b::before{content:var(--t-p3b)}
.t-f1a::before{content:var(--t-f1a)} .t-f1b::before{content:var(--t-f1b)}
.t-f2a::before{content:var(--t-f2a)} .t-f2b::before{content:var(--t-f2b)}
.t-f3a::before{content:var(--t-f3a)} .t-f3b::before{content:var(--t-f3b)}
.t-b1::before{content:var(--t-b1)} .t-b2::before{content:var(--t-b2)} .t-b3::before{content:var(--t-b3)}
.t-brand::before{content:var(--t-brand)} .t-cta::before{content:var(--t-cta)}

/* ===== 1. HOOK ===== */
#s-hook .stage{flex-direction:column;justify-content:center;align-items:flex-start}
.tag{font-family:var(--mono);font-size:var(--s-s);font-weight:400;letter-spacing:.18em;color:var(--accent);margin-bottom:48px}
#hook-title{display:flex;flex-direction:column;align-items:flex-start}
.ln{display:flex;gap:.28em}
.w3{color:var(--warm)}
#hook-line{margin-top:56px;width:760px;height:8px;border-radius:4px;background:var(--accent)}

/* ===== 2. MASALAH ===== */
#s-masalah .stage{align-items:center;justify-content:center}
#pains{display:flex;gap:48px}
.p-card{width:480px;height:400px;padding:44px;border-radius:28px;background:var(--panel);border:2px solid var(--edge);
  display:flex;flex-direction:column;justify-content:space-between}
.p-ic{width:104px;height:104px}
.p-ic *{fill:none;stroke:var(--warm);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.p-lbl{display:flex;flex-direction:column}

/* ===== 3. SOLUSI (mockup UI) ===== */
#s-solusi .stage{flex-direction:row;align-items:center;justify-content:center;gap:56px}
#mock{position:relative;width:1000px;height:564px;border-radius:32px;background:rgba(255,255,255,.05);border:2px solid var(--edge);display:flex}
.m-side{width:150px;padding:28px 0;display:flex;flex-direction:column;align-items:center;gap:26px;border-right:2px solid var(--edge)}
.m-logo{width:48px;height:48px;border-radius:14px;background:var(--accent)}
.m-nav{width:64px;height:12px;border-radius:6px;background:var(--edge)}
.m-main{flex:1;padding:22px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:240px 1fr;gap:20px}
.m-panel{position:relative;border-radius:20px;background:var(--panel);border:2px solid var(--edge);padding:20px}
.m-panel.wide{grid-column:1/-1}
.hl{position:absolute;inset:-8px;border-radius:26px;border:4px solid var(--accent);opacity:0;pointer-events:none}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:56px;gap:10px}
.key{border-radius:12px;background:var(--edge)}
.m-total{margin-top:14px;height:40px;border-radius:12px;background:var(--warm)}
.m-rows{display:flex;flex-direction:column;gap:14px}
.m-row{display:flex;align-items:center;gap:14px;height:36px}
.m-sq{width:36px;height:36px;border-radius:10px;background:var(--edge);flex:none}
.m-track{flex:1;height:14px;border-radius:7px;background:var(--edge)}
.m-fill{display:block;height:14px;border-radius:7px;background:var(--accent)}
.m-fill.low{background:var(--warm)}
.f80{width:80%} .f55{width:55%} .f30{width:30%} .f68{width:68%}
#m-lap svg{display:block;width:100%;height:100%}
.cb{fill:var(--accent)} .cb.last{fill:var(--warm)}
#m-trend{fill:none;stroke:var(--ink-soft);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#feats{display:flex;flex-direction:column;justify-content:space-between;width:440px;height:564px}
.feat{position:relative;display:flex;align-items:center;gap:28px;height:172px;padding:0 32px;border-radius:28px;
  background:var(--panel);border:2px solid var(--edge);opacity:.7}
.feat .hl{inset:-4px;border-radius:32px}
.f-ic{width:72px;height:72px;flex:none}
.f-ic *{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.f-lbl{display:flex;flex-direction:column}

/* ===== 4. BUKTI (count-up) ===== */
#s-bukti .stage{align-items:center;justify-content:center}
#stats{display:flex;flex-direction:column;gap:28px;width:100%}
.stat{position:relative;display:flex;align-items:center;justify-content:center;gap:56px;height:186px}
.stat-n{width:820px;display:flex;justify-content:flex-end;align-items:baseline;
  font-size:var(--s-xl);font-weight:700;letter-spacing:-.03em;line-height:1}
.suf{color:var(--accent)}
.rule{position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:var(--edge)}
.rule i{display:block;width:100%;height:4px;border-radius:2px;background:var(--accent)}

/* ===== 5. CTA ===== */
#s-cta .stage{flex-direction:column;align-items:center;justify-content:center;gap:72px}
#lockup{display:flex;align-items:center;gap:40px}
#mark{width:160px;height:160px}
.mk-bg{fill:var(--accent)} .mk-bar{fill:var(--ground)} .mk-dot{fill:var(--warm)}
.pill{display:flex;align-items:center;padding:28px 64px;border-radius:999px;background:var(--warm);color:var(--ground);
  font-size:var(--s-m);font-weight:700;letter-spacing:-.02em}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">

  <div id="bg" class="clip" data-start="0" data-duration="20" data-track-index="0">
    <div id="bg-glow" class="bg-layer"></div>
    <div id="bg-grid" class="bg-layer"></div>
    <svg id="bg-dots" viewBox="0 0 2520 1680" aria-hidden="true"></svg>
    <div id="bg-vig"></div>
  </div>

  <div id="cam">

    <!-- 1. HOOK 0.0-3.4 -->
    <div id="s-hook" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
      <div class="stage">
        <div class="tag tx t-tag"></div>
        <div id="hook-title">
          <div class="ln h-xl"><span class="w w1 tx t-h1a"></span><span class="w w2 tx t-h1b"></span></div>
          <div class="ln h-xl"><span class="w w3 tx t-h1c"></span></div>
        </div>
        <div id="hook-line"></div>
      </div>
    </div>

    <!-- 2. MASALAH 3.0-8.4 -->
    <div id="s-masalah" class="clip" data-start="3" data-duration="5.4" data-track-index="2">
      <div class="stage">
        <div id="pains">
          <div class="p-card">
            <svg class="p-ic" viewBox="0 0 104 104" aria-hidden="true"><path d="M16 36 52 18 88 36 88 72 52 90 16 72Z"/><path d="M16 36 52 54 88 36"/><path d="M52 54 52 90"/></svg>
            <div class="p-lbl h-m"><span class="tx t-p1a"></span><span class="tx t-p1b"></span></div>
          </div>
          <div class="p-card">
            <svg class="p-ic" viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="38"/><path d="M52 28 52 54 70 64"/></svg>
            <div class="p-lbl h-m"><span class="tx t-p2a"></span><span class="tx t-p2b"></span></div>
          </div>
          <div class="p-card">
            <svg class="p-ic" viewBox="0 0 104 104" aria-hidden="true"><path d="M26 14 64 14 80 30 80 90 26 90Z"/><path d="M64 14 64 30 80 30"/><path d="M38 52 68 52"/><path d="M38 68 68 68"/></svg>
            <div class="p-lbl h-m"><span class="tx t-p3a"></span><span class="tx t-p3b"></span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. SOLUSI 8.0-14.4 -->
    <div id="s-solusi" class="clip" data-start="8" data-duration="6.4" data-track-index="3">
      <div class="stage">
        <div id="mock">
          <div class="m-side"><i class="m-logo"></i><i class="m-nav"></i><i class="m-nav"></i><i class="m-nav"></i><i class="m-nav"></i></div>
          <div class="m-main">
            <div id="m-kasir" class="m-panel">
              <div class="keys"><i class="key"></i><i class="key"></i><i class="key"></i><i class="key"></i><i class="key"></i><i class="key"></i></div>
              <div class="m-total"></div>
              <div class="hl"></div>
            </div>
            <div id="m-stok" class="m-panel">
              <div class="m-rows">
                <div class="m-row"><i class="m-sq"></i><span class="m-track"><i class="m-fill f80"></i></span></div>
                <div class="m-row"><i class="m-sq"></i><span class="m-track"><i class="m-fill f55"></i></span></div>
                <div class="m-row"><i class="m-sq"></i><span class="m-track"><i class="m-fill low f30"></i></span></div>
                <div class="m-row"><i class="m-sq"></i><span class="m-track"><i class="m-fill f68"></i></span></div>
              </div>
              <div class="hl"></div>
            </div>
            <div id="m-lap" class="m-panel wide">
              <svg viewBox="0 0 726 216" aria-hidden="true">
                <rect class="cb" x="25"  y="130" width="52" height="70"  rx="8"/>
                <rect class="cb" x="103" y="104" width="52" height="96"  rx="8"/>
                <rect class="cb" x="181" y="116" width="52" height="84"  rx="8"/>
                <rect class="cb" x="259" y="78"  width="52" height="122" rx="8"/>
                <rect class="cb" x="337" y="90"  width="52" height="110" rx="8"/>
                <rect class="cb" x="415" y="52"  width="52" height="148" rx="8"/>
                <rect class="cb" x="493" y="64"  width="52" height="136" rx="8"/>
                <rect class="cb" x="571" y="24"  width="52" height="176" rx="8"/>
                <rect class="cb last" x="649" y="40" width="52" height="160" rx="8"/>
                <polyline id="m-trend" points="51,112 129,86 207,98 285,60 363,72 441,34 519,46 597,8 675,22"/>
              </svg>
              <div class="hl"></div>
            </div>
          </div>
        </div>
        <div id="feats">
          <div id="f1" class="feat">
            <svg class="f-ic" viewBox="0 0 72 72" aria-hidden="true"><path d="M10 26 36 12 62 26 62 50 36 64 10 50Z"/><path d="M10 26 36 40 62 26"/><path d="M36 40 36 64"/></svg>
            <div class="f-lbl h-m"><span class="tx t-f1a"></span><span class="tx t-f1b"></span></div>
            <div class="hl"></div>
          </div>
          <div id="f2" class="feat">
            <svg class="f-ic" viewBox="0 0 72 72" aria-hidden="true"><rect x="10" y="16" width="52" height="40" rx="8"/><path d="M10 28 62 28"/><path d="M20 44 34 44"/></svg>
            <div class="f-lbl h-m"><span class="tx t-f2a"></span><span class="tx t-f2b"></span></div>
            <div class="hl"></div>
          </div>
          <div id="f3" class="feat">
            <svg class="f-ic" viewBox="0 0 72 72" aria-hidden="true"><path d="M14 58 14 36"/><path d="M30 58 30 22"/><path d="M46 58 46 30"/><path d="M62 58 62 12"/></svg>
            <div class="f-lbl h-m"><span class="tx t-f3a"></span><span class="tx t-f3b"></span></div>
            <div class="hl"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. BUKTI 14.0-18.4 (angka = contoh, bukan klaim terverifikasi) -->
    <div id="s-bukti" class="clip" data-start="14" data-duration="4.4" data-track-index="4">
      <div class="stage">
        <div id="stats">
          <div class="stat">
            <div class="stat-n"><span id="n1" class="num tx">0</span><span class="suf tx">%</span></div>
            <div class="b-m tx t-b1"></div>
            <div class="rule"><i></i></div>
          </div>
          <div class="stat">
            <div class="stat-n"><span id="n2" class="num tx">0</span><span class="suf tx">+</span></div>
            <div class="b-m tx t-b2"></div>
            <div class="rule"><i></i></div>
          </div>
          <div class="stat">
            <div class="stat-n"><span id="n3" class="num tx">0</span><span class="suf tx">x</span></div>
            <div class="b-m tx t-b3"></div>
            <div class="rule"><i></i></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 5. CTA 18.0-20.0 -->
    <div id="s-cta" class="clip" data-start="18" data-duration="2" data-track-index="5">
      <div class="stage">
        <div id="lockup">
          <svg id="mark" viewBox="0 0 160 160" aria-hidden="true">
            <rect class="mk-bg" width="160" height="160" rx="40"/>
            <rect class="mk-bar" x="34"  y="88" width="22" height="36" rx="6"/>
            <rect class="mk-bar" x="69"  y="68" width="22" height="56" rx="6"/>
            <rect class="mk-bar" x="104" y="46" width="22" height="78" rx="6"/>
            <circle class="mk-dot" cx="115" cy="30" r="10"/>
          </svg>
          <div class="wordmark h-xl tx t-brand"></div>
        </div>
        <div id="cta-pill" class="pill"><span class="tx t-cta"></span></div>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  var IN = "power3.out", OUT = "power2.in", LOOP = "sine.inOut";

  /* Partikel latar: PRNG ber-seed, posisi tetap & deterministik */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var rnd = mulberry32(20261118), dots = document.getElementById("bg-dots"), NS = "http://www.w3.org/2000/svg";
  for (var i = 0; i < 72; i++) {
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", (rnd() * 2520).toFixed(1));
    c.setAttribute("cy", (rnd() * 1680).toFixed(1));
    c.setAttribute("r", (1.5 + rnd() * 3.5).toFixed(1));
    c.setAttribute("opacity", (0.2 + rnd() * 0.5).toFixed(2));
    c.setAttribute("class", i % 9 === 0 ? "d-warm" : i % 3 === 0 ? "d-ink" : "d-acc");
    dots.appendChild(c);
  }

  /* Count-up: objek JS dengan setter -> teks (jalan di setiap seek) */
  function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");}
  function counter(sel){
    var el = document.querySelector(sel), o = {_v: 0};
    Object.defineProperty(o, "v", {enumerable: true, get: function(){return o._v;}, set: function(x){o._v = x; el.textContent = fmt(Math.round(x));}});
    return o;
  }

  var tl = gsap.timeline({paused: true});

  /* LATAR: drift linear + napas glow (parallax) */
  tl.fromTo("#bg-glow", {x:-50,  y:20},  {x:50,   y:-20, duration:20, ease:"none"}, 0);
  tl.fromTo("#bg-grid", {x:0,    y:0},   {x:-120, y:-60, duration:20, ease:"none"}, 0);
  tl.fromTo("#bg-dots", {x:80,   y:40},  {x:-180, y:-90, duration:20, ease:"none"}, 0);
  tl.fromTo("#bg-glow", {scale:1}, {scale:1.12, duration:10, ease:LOOP, yoyo:true, repeat:1}, 0);

  /* KAMERA: push-in 1.00 -> 1.06 */
  tl.fromTo("#cam", {scale:1}, {scale:1.06, transformOrigin:"50% 50%", duration:20, ease:"power1.inOut"}, 0);

  /* 1. HOOK */
  tl.fromTo("#hook-line", {scaleX:.12, transformOrigin:"0% 50%"}, {scaleX:1, duration:1.5, ease:IN}, 0.2);
  tl.from(".w1", {y:60, opacity:.35, duration:.7, ease:IN}, 0.15);
  tl.from(".w2", {y:60, opacity:0, duration:.7, ease:IN}, 0.4);
  tl.from(".w3", {y:60, opacity:0, scale:.92, transformOrigin:"0% 50%", duration:.8, ease:IN}, 0.95);
  tl.to("#hook-title", {scale:1.03, transformOrigin:"0% 50%", duration:1.4, ease:LOOP}, 1.6);
  tl.to("#s-hook .stage", {opacity:0, x:-40, duration:.4, ease:OUT}, 3.0);

  /* 2. MASALAH */
  tl.fromTo("#s-masalah .stage", {opacity:0, x:40}, {opacity:1, x:0, duration:.5, ease:IN}, 3.0);
  tl.from(".p-card", {y:60, opacity:0, duration:.7, ease:IN, stagger:.15}, 3.3);
  tl.from(".p-ic", {scale:.6, opacity:0, transformOrigin:"50% 50%", duration:.5, ease:IN, stagger:.15}, 3.6);
  tl.to(".p-card", {scale:1.03, transformOrigin:"50% 50%", duration:1.2, ease:LOOP, yoyo:true, repeat:2, stagger:.15}, 4.5);
  tl.to("#s-masalah .stage", {opacity:0, x:-40, duration:.4, ease:OUT}, 8.0);

  /* 3. SOLUSI: mockup dibangun, 3 fitur menyorot bergiliran (10.2 / 11.4 / 12.6) */
  tl.fromTo("#s-solusi .stage", {opacity:0, x:40}, {opacity:1, x:0, duration:.5, ease:IN}, 8.0);
  tl.from("#mock", {y:50, opacity:0, duration:.7, ease:IN}, 8.2);
  tl.from(".m-panel", {y:24, opacity:0, duration:.5, ease:IN, stagger:.12}, 8.6);
  tl.from(".feat", {x:40, opacity:0, duration:.5, ease:IN, stagger:.12}, 8.5);
  tl.from(".m-fill", {scaleX:0, transformOrigin:"0% 50%", duration:.7, ease:IN, stagger:.08}, 9.0);
  tl.from(".cb", {scaleY:0, transformOrigin:"50% 100%", duration:.6, ease:IN, stagger:.05}, 9.0);
  tl.from("#m-trend", {opacity:0, duration:.5, ease:IN}, 9.6);
  [["#f1", "#m-stok"], ["#f2", "#m-kasir"], ["#f3", "#m-lap"]].forEach(function (p, i) {
    var t = 10.2 + i * 1.2, hl = p[0] + " .hl, " + p[1] + " .hl";
    tl.to(p[0], {opacity:1, scale:1.04, transformOrigin:"0% 50%", duration:.35, ease:IN}, t);
    tl.to(hl, {opacity:1, duration:.35, ease:IN}, t);
    if (i < 2) {
      tl.to(p[0], {opacity:.7, scale:1, duration:.3, ease:OUT}, t + .9);
      tl.to(hl, {opacity:0, duration:.3, ease:OUT}, t + .9);
    }
  });
  tl.to("#s-solusi .stage", {opacity:0, x:-40, duration:.4, ease:OUT}, 14.0);

  /* 4. BUKTI: 3 angka count-up berurutan */
  tl.fromTo("#s-bukti .stage", {opacity:0, x:40}, {opacity:1, x:0, duration:.5, ease:IN}, 14.0);
  tl.from(".stat", {y:40, opacity:0, duration:.6, ease:IN, stagger:.3}, 14.3);
  tl.from(".rule i", {scaleX:0, transformOrigin:"0% 50%", duration:.9, ease:IN, stagger:.3}, 14.5);
  [["#n1", 100], ["#n2", 10], ["#n3", 3]].forEach(function (p, i) {
    tl.to(counter(p[0]), {v:p[1], duration:1.5, ease:IN}, 14.5 + i * .3);
  });
  tl.to(".stat-n", {scale:1.03, transformOrigin:"100% 50%", duration:1.4, ease:LOOP}, 16.6);
  tl.to("#s-bukti .stage", {opacity:0, x:-40, duration:.4, ease:OUT}, 18.0);

  /* 5. CTA: mendarat <= 18.8 s, lalu HOLD 1.2 s */
  tl.fromTo("#s-cta .stage", {opacity:0, x:40}, {opacity:1, x:0, duration:.5, ease:IN}, 18.0);
  tl.from("#mark", {scale:.6, opacity:0, transformOrigin:"50% 50%", duration:.5, ease:IN}, 18.05);
  tl.from(".wordmark", {x:40, opacity:0, duration:.5, ease:IN}, 18.15);
  tl.from("#cta-pill", {y:40, opacity:0, duration:.5, ease:IN}, 18.3);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
})();
</script>
