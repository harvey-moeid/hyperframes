<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>BYGA.AI Kinetic 30s - {{judul_episode}}</title>
<!--
  MODEL: KINETIC TYPOGRAPHY 30 DETIK (tujuan: REACH)
  9:16 | 1080x1920 | 30 FPS | 30 detik. Teks besar, perubahan cepat, tanpa karakter manusia.
  Adegan: 00-03 Hook | 03-09 Masalah | 09-20 Reveal | 20-26 Bukti | 26-30 CTA
  Ganti semua {{placeholder}}. Atribut data-* mengikuti konvensi HyperFrames; verifikasi sebelum render.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root { --midnight:#050914; --navy:#0A1428; --blue:#1677FF; --cyan:#00E5FF; --white:#FFFFFF; --glass:rgba(255,255,255,.06); --gb:rgba(0,229,255,.28); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1920px; background:var(--midnight); overflow:hidden; font-family:"Inter","Poppins",system-ui,sans-serif; color:var(--white); }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:radial-gradient(ellipse at 50% 35%,var(--navy),var(--midnight) 70%); }
  .bg-grid { position:absolute; inset:0; opacity:.15; background-image:linear-gradient(var(--blue) 1px,transparent 1px),linear-gradient(90deg,var(--blue) 1px,transparent 1px); background-size:90px 90px; }
  .bg-glow { position:absolute; width:1000px; height:1000px; left:40px; top:380px; border-radius:50%; background:radial-gradient(circle,rgba(22,119,255,.5),transparent 65%); filter:blur(50px); }
  .scene { position:absolute; inset:0; padding:160px 70px 380px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:40px; opacity:0; }
  .big { font-size:170px; line-height:.95; font-weight:900; letter-spacing:-4px; }
  .big .hl { color:var(--cyan); }
  .mid { font-size:84px; line-height:1.1; font-weight:800; }
  .small { font-size:44px; color:rgba(255,255,255,.8); line-height:1.3; max-width:860px; }
  .kicker { font-size:34px; letter-spacing:8px; color:var(--cyan); font-weight:700; text-transform:uppercase; }
  .glass { background:var(--glass); border:2px solid var(--gb); border-radius:48px; backdrop-filter:blur(24px); box-shadow:0 0 80px rgba(22,119,255,.25); padding:40px 56px; font-size:46px; font-weight:700; }
  .metric { font-size:220px; font-weight:900; color:var(--cyan); line-height:1; }
  #subtitle { position:absolute; left:60px; right:60px; bottom:300px; text-align:center; font-size:58px; font-weight:800; line-height:1.25; padding:22px 32px; border-radius:28px; background:rgba(5,9,20,.72); border:2px solid var(--gb); opacity:0; }
  #progress { position:absolute; left:60px; right:60px; bottom:220px; height:8px; background:rgba(255,255,255,.12); border-radius:8px; }
  #progress-fill { height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--cyan)); border-radius:8px; }
  #brand { position:absolute; top:120px; left:70px; font-weight:900; font-size:40px; letter-spacing:4px; }
  #brand span { color:var(--cyan); }
</style>
</head>
<body>
<div id="stage" data-composition-id="byga-kinetic-30" data-width="1080" data-height="1920" data-fps="30" data-duration="30">
  <div class="bg-grid"></div><div class="bg-glow"></div>
  <div id="brand">BYGA<span>.AI</span></div>

  <section class="scene clip" data-start="0" data-duration="3" data-track-index="1" data-sub="{{sub_1}}">
    <div class="big in">{{hook_kata_1}}<br><span class="hl">{{hook_kata_2}}</span></div>
  </section>

  <section class="scene clip" data-start="3" data-duration="6" data-track-index="1" data-sub="{{sub_2}}">
    <div class="kicker in">{{kicker_masalah}}</div>
    <div class="mid in">{{masalah_sehari_hari}}</div>
    <div class="small in">{{penjelasan_singkat}}</div>
  </section>

  <section class="scene clip" data-start="9" data-duration="11" data-track-index="1" data-sub="{{sub_3}}">
    <div class="kicker in">{{kicker_reveal}}</div>
    <div class="big in"><span class="hl">{{reveal_utama}}</span></div>
    <div class="glass in">{{tools_yang_dipakai}}</div>
    <div class="small in">{{manfaat_singkat}}</div>
  </section>

  <section class="scene clip" data-start="20" data-duration="6" data-track-index="1" data-sub="{{sub_4}}">
    <div class="kicker in">{{kicker_bukti}}</div>
    <div class="metric in">{{angka_bukti}}</div>
    <div class="small in">{{label_bukti}}</div>
  </section>

  <section class="scene clip" data-start="26" data-duration="4" data-track-index="1" data-sub="{{sub_5}}">
    <div class="mid in">{{cta}} <span style="color:var(--cyan)">{{aksi_cta}}</span></div>
    <div class="kicker in">Build Anything From Your Phone.</div>
  </section>

  <div id="subtitle"></div>
  <div id="progress"><div id="progress-fill"></div></div>
</div>
<script>
  const stage = document.getElementById("stage");
  const D = +stage.dataset.duration;
  const sub = document.getElementById("subtitle");
  const tl = gsap.timeline({ paused: true });
  document.querySelectorAll(".scene").forEach(el => {
    const s = +el.dataset.start, d = +el.dataset.duration;
    tl.set(el, { opacity: 1 }, s);
    tl.from(el.querySelectorAll(".in"), { y: 90, opacity: 0, scale: .88, duration: .45, stagger: .1, ease: "back.out(1.5)" }, s + .05);
    tl.to(el, { opacity: 0, duration: .2 }, s + d - .2);
    tl.call(() => { sub.textContent = el.dataset.sub; }, null, s);
    tl.to(sub, { opacity: 1, duration: .2 }, s);
    tl.to(sub, { opacity: 0, duration: .15 }, s + d - .15);
  });
  tl.to("#progress-fill", { width: "100%", duration: D, ease: "none" }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines[stage.dataset.compositionId] = tl;
</script>
</body>
</html>
