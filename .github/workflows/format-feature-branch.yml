name: Format feature branch files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Format Worker implementation and touched workflows
        run: |
          bunx oxfmt@0.41.0 --write \
            package.json \
            cloudflare-free/worker/src/index.js \
            cloudflare-free/worker/src/render-guard.js \
            cloudflare-free/worker/src/page.js \
            cloudflare-free/worker/src/ui/client-core.js \
            cloudflare-free/worker/src/ui/client-data.js \
            cloudflare-free/worker/src/ui/client-create.js \
            cloudflare-free/worker/tests/render-guard.test.mjs \
            .github/workflows/render-video.yml \
            .github/workflows/cloudflare-free-worker-ci.yml \
            .github/workflows/ci.yml
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json cloudflare-free/worker/src/index.js cloudflare-free/worker/src/render-guard.js cloudflare-free/worker/src/page.js cloudflare-free/worker/src/ui/client-core.js cloudflare-free/worker/src/ui/client-data.js cloudflare-free/worker/src/ui/client-create.js cloudflare-free/worker/tests/render-guard.test.mjs .github/workflows/render-video.yml .github/workflows/cloudflare-free-worker-ci.yml .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format unified render worker changes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
