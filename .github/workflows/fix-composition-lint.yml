name: Fix composition lint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_composition_lint.py
      - name: Commit jika ada perubahan
        run: |
          if git diff --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fix: pindah #tpls ke dalam root + tambah id clip (lint)"
          git push
