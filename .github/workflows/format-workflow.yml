name: Export formatted CI workflow
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          show-progress: false
          sparse-checkout: |
            .editorconfig
            .oxfmtrc.json
            .github/workflows/ci.yml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Format CI workflow
        run: |
          bunx --yes oxfmt@0.41.0 --write .github/workflows/ci.yml
          mkdir -p /tmp/format-out
          cp .github/workflows/ci.yml /tmp/format-out/ci.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formatted-ci-workflow
          path: /tmp/format-out/ci.yml
          if-no-files-found: error
          retention-days: 1
